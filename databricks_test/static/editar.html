<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar dados do painel</title>
<link rel="stylesheet" href="/fonts.css">
<style>
  :root {
    --fundo:#f3f2ee; --card:#fff; --borda:#d9d6cf; --linha:#e2dfd8;
    --tinta:#1d2530; --tinta2:#2b3644; --cinza:#6b7280; --cinza2:#4b5563;
    --claro:#ebe9e3; --verm:#b4232a; --vermEsc:#9b1d23; --ambar:#b7790f; --verde:#2f7d4f;
    --corpo:'Barlow', system-ui, 'Segoe UI', sans-serif;
    --cond:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 var(--corpo); color:var(--tinta); background:var(--fundo); }
  .pagina { max-width:1600px; margin:0 auto; padding:16px 24px 28px; }

  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
           border-bottom:3px solid var(--verm); padding-bottom:8px; margin-bottom:14px; }
  .eyebrow { font:700 14px/1 var(--cond); text-transform:uppercase; letter-spacing:.12em; color:var(--verm); margin-bottom:4px; }
  h1 { margin:0; font:800 24px/1.15 var(--corpo); color:var(--tinta); }
  .lado { display:flex; align-items:center; gap:14px; font-size:13px; color:var(--cinza); }
  .lado a { color:var(--tinta); font-weight:600; text-decoration:none; border:1px solid #c9c5bc; background:#fff; border-radius:999px; padding:4px 12px; }
  .lado a:hover { background:#ece9e2; }

  .topo { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { font:600 14px var(--corpo); color:var(--tinta); background:transparent; border:0; border-radius:999px; padding:6px 14px; cursor:pointer; }
  nav button:hover { background:#e6e3dc; }
  nav button.ativa { background:var(--tinta); color:#fff; }
  .acoes { display:flex; align-items:center; gap:12px; }
  #msg { font-size:13px; font-weight:600; }
  #msg.erro { color:var(--verm); } #msg.ok { color:var(--verde); }

  .card { background:var(--card); border:1px solid var(--borda); border-radius:2px; overflow:auto; max-height:calc(100vh - 210px); }
  table { border-collapse:separate; border-spacing:0; min-width:100%; }
  th { position:sticky; top:0; z-index:2; text-align:left; white-space:nowrap; padding:8px 8px;
       background:var(--tinta); color:#fff; font:700 13px var(--cond); text-transform:uppercase; letter-spacing:.06em; }
  th.auto { background:var(--tinta2); }
  td { padding:5px 6px; border-bottom:1px solid var(--linha); vertical-align:top; white-space:nowrap; }
  tbody tr:hover td { background:#faf9f6; }
  tr.nova td { background:#fdf3f3; }

  input, select { font:500 14px var(--corpo); color:var(--tinta); padding:5px 7px; min-width:96px;
                  border:1px solid #cfccc4; border-radius:2px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--verm); outline-offset:-1px; border-color:var(--verm); }
  input[readonly] { background:var(--claro); color:var(--cinza2); font-weight:700; }
  select.v-ok { color:var(--verde); font-weight:700; }
  select.v-amb { color:var(--ambar); font-weight:700; }
  select.v-ruim { color:var(--verm); font-weight:700; }
  select.v-neutro { color:var(--cinza); }
  td.meta { color:var(--cinza); font-size:12px; }
  td.botoes { display:flex; gap:6px; border-bottom:1px solid var(--linha); }

  button.acao { font:600 14px var(--corpo); padding:5px 12px; border-radius:999px; border:1px solid #c9c5bc; background:#fff; color:var(--tinta); cursor:pointer; }
  button.acao:hover { background:#ece9e2; }
  button.salvar { background:var(--verm); color:#fff; border-color:var(--verm); border-radius:2px; }
  button.salvar:hover { background:var(--vermEsc); }
  button.excluir { color:var(--verm); border-color:#e3b9bb; }
  button.excluir:hover { background:#fbe9ea; }
  button:disabled { opacity:.45; cursor:default; }
  .vazio { padding:28px; text-align:center; color:var(--cinza); }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div>
      <div class="eyebrow">Roadmap executivo</div>
      <h1>Editar dados do painel</h1>
    </div>
    <div class="lado"><span id="quem"></span><a href="/">← Ver painel</a></div>
  </header>

  <div class="topo">
    <nav id="abas"></nav>
    <div class="acoes"><span id="msg"></span><button class="acao" id="nova">+ Nova linha</button></div>
  </div>

  <div class="card"><table id="grade"></table></div>
</div>

<script>
const TABELAS = ["tbIniciativas", "tbFrentes", "tbPainel", "tbPontos"];
const STATUS = ["", "OK", "Parcial", "Bloqueio", "Sem informação", "NA"];
const OPCOES = {
  Concluida: ["", "Sim", "Não"],
  CaminhoCritico: ["", "Sim", "Não"],
  RiscoNivel: ["", "Alto", "Médio", "Baixo"],
  Veredito: ["", "Não confirmável", "Com condições", "Confirmado"],
  Camada: ["", "Fundação", "Motor & Sistemas", "Experiência", "Operação"],
  Escopo: STATUS, Prazo: STATUS, Entregaveis: STATUS,
  Tipo: ["", "Evolução", "Pendência", "Atenção", "Risco"],
  Criticidade: ["", "Crítico", "Alto", "Médio", "Baixo"],
};
// Na tbPontos, "Prazo" é data ou texto livre (ex.: a definir), não status de prontidão.
const opcoesDe = n => (tabela === "tbPontos" && n === "Prazo" ? null : OPCOES[n] || (n.startsWith("Rec_") ? STATUS : null));

// Cor do texto conforme o valor, no mesmo código de cores do painel.
const COR = {
  "OK": "v-ok", "Confirmado": "v-ok", "Baixo": "v-ok",
  "Parcial": "v-amb", "Com condições": "v-amb", "Médio": "v-amb",
  "Bloqueio": "v-ruim", "Não confirmável": "v-ruim", "Alto": "v-ruim",
  "NA": "v-neutro", "Sem informação": "v-neutro",
};
function pintar(sel) {
  sel.classList.remove("v-ok", "v-amb", "v-ruim", "v-neutro");
  const c = COR[sel.value]; if (c) sel.classList.add(c);
}

let tabela = TABELAS[0], info = null;
const $ = id => document.getElementById(id);

function aviso(texto, tipo) { const m = $("msg"); m.textContent = texto || ""; m.className = tipo || ""; }

async function chamar(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
  return d;
}

function abas() {
  const nav = $("abas"); nav.textContent = "";
  TABELAS.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t; b.className = t === tabela ? "ativa" : "";
    b.onclick = () => { tabela = t; abas(); carregar(); };
    nav.appendChild(b);
  });
}

function campo(col, valor, travado) {
  const ops = opcoesDe(col.nome);
  let el;
  if (ops) {
    el = document.createElement("select");
    ops.forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = o || "—"; el.appendChild(op); });
    if (valor && !ops.includes(valor)) { const op = document.createElement("option"); op.value = op.textContent = valor; el.appendChild(op); }
    el.onchange = () => pintar(el);
  } else {
    el = document.createElement("input");
    el.type = col.tipo === "DATE" ? "date" : "text";
  }
  el.value = valor == null ? "" : String(valor).slice(0, col.tipo === "DATE" ? 10 : undefined);
  el.dataset.col = col.nome;
  if (travado) el.readOnly = true;
  if (ops) pintar(el);
  return el;
}

function linhaDOM(linha, nova) {
  const tr = document.createElement("tr");
  if (nova) tr.className = "nova";
  info.colunas.forEach(col => {
    const td = document.createElement("td");
    td.appendChild(campo(col, linha[col.nome], !nova && col.nome === info.chave));
    tr.appendChild(td);
  });
  const meta = document.createElement("td"); meta.className = "meta";
  meta.textContent = linha.AlteradoPor ? `${linha.AlteradoPor} · ${String(linha.AlteradoEm || "").replace("T", " ").slice(0, 16)}` : "";
  tr.appendChild(meta);

  const acoes = document.createElement("td"); acoes.className = "botoes";
  const s = document.createElement("button"); s.textContent = "Salvar"; s.className = "acao salvar";
  s.onclick = () => salvar(tr, s);
  acoes.appendChild(s);
  if (info.chave) {
    const x = document.createElement("button"); x.textContent = "Excluir"; x.className = "acao excluir";
    x.onclick = () => excluir(tr, nova);
    acoes.appendChild(x);
  }
  tr.appendChild(acoes);
  return tr;
}

function desenhar() {
  const g = $("grade"); g.textContent = "";
  const cab = document.createElement("tr");
  info.colunas.forEach(c => { const th = document.createElement("th"); th.textContent = c.nome; cab.appendChild(th); });
  [["Última alteração", true], ["", true]].forEach(([t, a]) => { const th = document.createElement("th"); th.textContent = t; if (a) th.className = "auto"; cab.appendChild(th); });
  const thead = document.createElement("thead"); thead.appendChild(cab); g.appendChild(thead);
  const tb = document.createElement("tbody"); tb.id = "corpo"; g.appendChild(tb);
  info.linhas.forEach(l => tb.appendChild(linhaDOM(l, false)));
  if (!info.linhas.length) {
    const tr = document.createElement("tr"), td = document.createElement("td");
    td.colSpan = info.colunas.length + 2; td.className = "vazio";
    td.textContent = "Nenhuma linha ainda. Use “+ Nova linha” para começar.";
    tr.appendChild(td); tb.appendChild(tr);
  }
  $("nova").disabled = !info.chave && info.linhas.length >= 1;
}

function ler(tr) {
  const o = {};
  tr.querySelectorAll("[data-col]").forEach(el => { o[el.dataset.col] = el.value; });
  return o;
}

async function salvar(tr, botao) {
  botao.disabled = true; aviso("Salvando…");
  try { await chamar("/api/" + tabela, { linha: ler(tr) }); aviso("Salvo. O painel atualiza em até 5 minutos.", "ok"); await carregar(true); }
  catch (e) { aviso(e.message, "erro"); }
  botao.disabled = false;
}

async function excluir(tr, nova) {
  if (nova) { tr.remove(); return; }
  const chave = ler(tr)[info.chave];
  if (!confirm(`Excluir a linha ${info.chave} = ${chave}?`)) return;
  try { await chamar(`/api/${tabela}/excluir`, { chave }); aviso("Linha excluída.", "ok"); await carregar(true); }
  catch (e) { aviso(e.message, "erro"); }
}

async function carregar(manterAviso) {
  if (!manterAviso) aviso("Carregando…");
  try {
    info = await chamar("/api/" + tabela);
    $("quem").textContent = info.usuario;
    desenhar();
    if (!manterAviso) aviso("");
  } catch (e) { aviso(e.message, "erro"); $("grade").textContent = ""; }
}

$("nova").onclick = () => {
  if (!info) return;
  const tb = $("corpo");
  if (tb.querySelector(".vazio")) tb.textContent = "";
  tb.appendChild(linhaDOM({}, true));
  tb.lastChild.querySelector("input,select").focus();
};

abas(); carregar();
</script>
</body>
</html>
