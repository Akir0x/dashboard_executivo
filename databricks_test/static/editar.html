<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar dados do painel</title>
<style>
  :root { --borda:#d9dde3; --fundo:#f6f7f9; --texto:#1f2937; --cinza:#6b7280; --azul:#1d4ed8; --verm:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, "Segoe UI", sans-serif; color:var(--texto); background:var(--fundo); }
  header { display:flex; gap:16px; align-items:baseline; padding:14px 20px; background:#fff; border-bottom:1px solid var(--borda); }
  header h1 { margin:0; font-size:18px; }
  header span, header a { color:var(--cinza); font-size:13px; }
  nav { display:flex; gap:4px; padding:12px 20px 0; }
  nav button { border:1px solid var(--borda); border-bottom:none; background:#eceff3; padding:8px 14px; border-radius:6px 6px 0 0; cursor:pointer; font:inherit; }
  nav button.ativa { background:#fff; font-weight:600; }
  main { padding:0 20px 24px; }
  .caixa { background:#fff; border:1px solid var(--borda); border-radius:0 6px 6px 6px; padding:12px; overflow:auto; max-height:calc(100vh - 190px); }
  table { border-collapse:collapse; min-width:100%; }
  th, td { border-bottom:1px solid var(--borda); padding:4px; vertical-align:top; text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#fff; font-size:12px; color:var(--cinza); z-index:1; }
  input, select { font:inherit; padding:5px 6px; border:1px solid var(--borda); border-radius:4px; min-width:90px; background:#fff; }
  input[readonly] { background:#f1f3f5; color:var(--cinza); }
  td.meta { color:var(--cinza); font-size:12px; }
  button.acao { font:inherit; padding:5px 10px; border-radius:4px; border:1px solid var(--borda); background:#fff; cursor:pointer; }
  button.salvar { background:var(--azul); color:#fff; border-color:var(--azul); }
  button.excluir { color:var(--verm); }
  button:disabled { opacity:.5; cursor:default; }
  .barra { display:flex; gap:12px; align-items:center; margin:10px 0; }
  #msg { min-height:20px; font-size:13px; }
  #msg.erro { color:var(--verm); } #msg.ok { color:#047857; }
</style>
</head>
<body>
<header>
  <h1>Editar dados do painel</h1>
  <span id="quem"></span>
  <a href="/">← Ver painel</a>
</header>
<nav id="abas"></nav>
<main>
  <div class="barra"><button class="acao" id="nova">+ Nova linha</button><span id="msg"></span></div>
  <div class="caixa"><table id="grade"></table></div>
</main>
<script>
const TABELAS = ["tbIniciativas", "tbFrentes", "tbPainel"];
const STATUS = ["", "OK", "Parcial", "Bloqueio", "Sem informação", "NA"];
const OPCOES = {
  Concluida: ["", "Sim", "Não"],
  CaminhoCritico: ["", "Sim", "Não"],
  RiscoNivel: ["", "Alto", "Médio", "Baixo"],
  Veredito: ["", "Não confirmável", "Com condições", "Confirmado"],
  Camada: ["", "Fundação", "Motor & Sistemas", "Experiência", "Operação"],
  Escopo: STATUS, Prazo: STATUS, Entregaveis: STATUS,
};
const opcoesDe = n => OPCOES[n] || (n.startsWith("Rec_") ? STATUS : null);

let tabela = TABELAS[0], info = null;
const $ = id => document.getElementById(id);

function aviso(texto, tipo) { const m = $("msg"); m.textContent = texto || ""; m.className = tipo || ""; }

async function chamar(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
  return d;
}

function abas() {
  const nav = $("abas"); nav.textContent = "";
  TABELAS.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t; b.className = t === tabela ? "ativa" : "";
    b.onclick = () => { tabela = t; abas(); carregar(); };
    nav.appendChild(b);
  });
}

function campo(col, valor, travado) {
  const ops = opcoesDe(col.nome);
  let el;
  if (ops) {
    el = document.createElement("select");
    ops.forEach(o => { const op = document.createElement("option"); op.value = o; op.textContent = o || "—"; el.appendChild(op); });
    if (valor && !ops.includes(valor)) { const op = document.createElement("option"); op.value = op.textContent = valor; el.appendChild(op); }
  } else {
    el = document.createElement("input");
    el.type = col.tipo === "DATE" ? "date" : "text";
  }
  el.value = valor == null ? "" : String(valor).slice(0, col.tipo === "DATE" ? 10 : undefined);
  el.dataset.col = col.nome;
  if (travado) el.readOnly = true;
  return el;
}

function linhaDOM(linha, nova) {
  const tr = document.createElement("tr");
  info.colunas.forEach(col => {
    const td = document.createElement("td");
    td.appendChild(campo(col, linha[col.nome], !nova && col.nome === info.chave));
    tr.appendChild(td);
  });
  const meta = document.createElement("td"); meta.className = "meta";
  meta.textContent = linha.AlteradoPor ? `${linha.AlteradoPor} · ${String(linha.AlteradoEm || "").replace("T", " ").slice(0, 16)}` : "";
  tr.appendChild(meta);

  const acoes = document.createElement("td");
  const s = document.createElement("button"); s.textContent = "Salvar"; s.className = "acao salvar";
  s.onclick = () => salvar(tr, s);
  acoes.appendChild(s);
  if (info.chave) {
    const x = document.createElement("button"); x.textContent = "Excluir"; x.className = "acao excluir";
    x.onclick = () => excluir(tr, nova);
    acoes.appendChild(x);
  }
  tr.appendChild(acoes);
  return tr;
}

function desenhar() {
  const g = $("grade"); g.textContent = "";
  const cab = document.createElement("tr");
  info.colunas.forEach(c => { const th = document.createElement("th"); th.textContent = c.nome; cab.appendChild(th); });
  ["Última alteração", ""].forEach(t => { const th = document.createElement("th"); th.textContent = t; cab.appendChild(th); });
  g.appendChild(cab);
  info.linhas.forEach(l => g.appendChild(linhaDOM(l, false)));
  $("nova").disabled = !info.chave && info.linhas.length >= 1;
}

function ler(tr) {
  const o = {};
  tr.querySelectorAll("[data-col]").forEach(el => { o[el.dataset.col] = el.value; });
  return o;
}

async function salvar(tr, botao) {
  botao.disabled = true; aviso("Salvando…");
  try { await chamar("/api/" + tabela, { linha: ler(tr) }); aviso("Salvo. O painel atualiza em até 5 minutos para quem já estava com ele aberto.", "ok"); await carregar(true); }
  catch (e) { aviso(e.message, "erro"); }
  botao.disabled = false;
}

async function excluir(tr, nova) {
  if (nova) { tr.remove(); return; }
  const chave = ler(tr)[info.chave];
  if (!confirm(`Excluir a linha ${info.chave} = ${chave}?`)) return;
  try { await chamar(`/api/${tabela}/excluir`, { chave }); aviso("Linha excluída.", "ok"); await carregar(true); }
  catch (e) { aviso(e.message, "erro"); }
}

async function carregar(manterAviso) {
  if (!manterAviso) aviso("Carregando…");
  try {
    info = await chamar("/api/" + tabela);
    $("quem").textContent = info.usuario;
    desenhar();
    if (!manterAviso) aviso("");
  } catch (e) { aviso(e.message, "erro"); $("grade").textContent = ""; }
}

$("nova").onclick = () => {
  if (!info) return;
  $("grade").appendChild(linhaDOM({}, true));
  $("grade").lastChild.querySelector("input,select").focus();
};

abas(); carregar();
</script>
</body>
</html>
